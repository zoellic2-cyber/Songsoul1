
name: Build Song Soul APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/source"
          PROJECT_DIR=$(find "$RUNNER_TEMP/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android Gradle project found in ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SongSoul-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
